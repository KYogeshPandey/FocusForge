version: '3.8'

services:
  mongodb:
    image: mongo:7.0
    container_name: focusforge-mongodb
    restart: always
    ports:
      - '27017:27017'
    environment:
      MONGO_INITDB_DATABASE: focusforge
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ['CMD', 'mongosh', '--eval', 'db.adminCommand("ping")']
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: focusforge-api
    restart: always
    ports:
      - '5000:5000'
    environment:
      NODE_ENV: production
      PORT: 5000
      MONGODB_URI: mongodb://mongodb:27017/focusforge
      JWT_ACCESS_SECRET: dev-secret-docker-jwt-key-replace-in-production-min32chars
      JWT_REFRESH_SECRET: dev-refresh-docker-jwt-key-replace-in-production-min32chars
      ACCESS_TOKEN_TTL: 15m
      REFRESH_TOKEN_TTL: 7d
      CLIENT_ORIGIN: http://localhost:80
      RATE_LIMIT_WINDOW_MINUTES: 15
      RATE_LIMIT_MAX_REQUESTS: 300
      AUTH_RATE_LIMIT_MAX_REQUESTS: 30
    depends_on:
      mongodb:
        condition: service_healthy
    healthcheck:
      test: ['CMD', 'wget', '--no-verbose', '--tries=1', '--spider', 'http://localhost:5000/health']
      interval: 15s
      timeout: 5s
      retries: 3

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        VITE_API_URL: http://localhost:5000/api/v1
    container_name: focusforge-web
    restart: always
    ports:
      - '80:80'
    depends_on:
      - api

volumes:
  mongo_data:
