services:
  - type: web
    name: focusforge-api
    runtime: node
    plan: free
    region: oregon
    buildCommand: npm install && npm run build --workspace=@focusforge/shared && npm run build --workspace=api
    startCommand: node apps/api/dist/server.js
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 5000
      - key: MONGODB_URI
        sync: false # Set securely in Render dashboard
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: ACCESS_TOKEN_TTL
        value: 15m
      - key: REFRESH_TOKEN_TTL
        value: 7d
      - key: CLIENT_ORIGIN
        sync: false # Set to frontend production domain (e.g. https://app.focusforge.dev or https://focusforge.vercel.app)
      - key: RATE_LIMIT_WINDOW_MINUTES
        value: 15
      - key: RATE_LIMIT_MAX_REQUESTS
        value: 300
      - key: AUTH_RATE_LIMIT_MAX_REQUESTS
        value: 20
